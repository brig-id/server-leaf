[package]
name = "leaf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[[bin]]
name = "leaf"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# brig·id core crates (git dep pointing to the core repository)
brigid-api = { git = "https://github.com/brig-id/core", rev = "d5f14df608858f417ab24dfec0beb0e9dd7cf224", package = "brigid-api" }
brigid-store = { git = "https://github.com/brig-id/core", rev = "d5f14df608858f417ab24dfec0beb0e9dd7cf224", package = "brigid-store" }
brigid-identity = { git = "https://github.com/brig-id/core", rev = "d5f14df608858f417ab24dfec0beb0e9dd7cf224", package = "brigid-identity" }
brigid-webauthn = { git = "https://github.com/brig-id/core", rev = "d5f14df608858f417ab24dfec0beb0e9dd7cf224", package = "brigid-webauthn" }
brigid-oidc = { git = "https://github.com/brig-id/core", rev = "d5f14df608858f417ab24dfec0beb0e9dd7cf224", package = "brigid-oidc" }

# Cryptographic primitives
brigid-crypto = { git = "https://github.com/brig-id/crypto", rev = "52d0983b557b6f294b9f40a9896d95d03e2e4681" }

# CLI + configuration
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP / TLS
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs"] }

# Misc
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
# Rust 1.86+ compatibility patches — identical to the ones in brig-id/core.
# `asn1-rs-impl` calls `Span::call_site().into()` which lost its `From` impl
# in newer proc-macro2; the patched version calls `proc_macro2::Span::call_site()`.
# `openssl-macros` emitted C-string literals that Rust 1.96 rejects; patched.
# `webauthn-authenticator-rs` bumps rust-version guard to 1.88 and silences
# the Rust 1.96 `clippy::needless_pass_by_ref_mut` warnings.
asn1-rs-impl = { path = "vendor/asn1-rs-impl" }
openssl-macros = { path = "vendor/openssl-macros" }
webauthn-authenticator-rs = { path = "vendor/webauthn-authenticator-rs" }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
