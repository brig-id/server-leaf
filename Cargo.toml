[package]
name = "seedling"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.89"

[[bin]]
name = "seedling"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# brig·id core crates (git dep pointing to the core repository)
brigid-api = { git = "https://github.com/brig-id/core", rev = "0f2aa1b6ab02a6b6e4ab7566f9b812eec0388908", package = "brigid-api" }
brigid-store = { git = "https://github.com/brig-id/core", rev = "0f2aa1b6ab02a6b6e4ab7566f9b812eec0388908", package = "brigid-store" }
brigid-identity = { git = "https://github.com/brig-id/core", rev = "0f2aa1b6ab02a6b6e4ab7566f9b812eec0388908", package = "brigid-identity" }
brigid-webauthn = { git = "https://github.com/brig-id/core", rev = "0f2aa1b6ab02a6b6e4ab7566f9b812eec0388908", package = "brigid-webauthn" }
brigid-oidc = { git = "https://github.com/brig-id/core", rev = "0f2aa1b6ab02a6b6e4ab7566f9b812eec0388908", package = "brigid-oidc" }

# Cryptographic primitives
brigid-crypto = { git = "https://github.com/brig-id/crypto", tag = "v0.1.0" }

# CLI + configuration
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP / TLS
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
# Only used to install a default process-wide `CryptoProvider` at startup —
# see the call site in main.rs for why this is needed.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
time = "0.3"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
tempfile = "3"
# Reads the payload of an ID token in the relying-party smoke test.
base64ct = { version = "1", features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }

# E2E smoke tests (tests/smoke.rs) — real HTTP against a spawned `seedling`
# subprocess, exercising a full WebAuthn ceremony via a software passkey.
reqwest = { version = "0.13", features = ["json"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
