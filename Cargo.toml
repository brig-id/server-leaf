[package]
name = "leaf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[[bin]]
name = "leaf"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# brig·id core crates (git dep pointing to the core repository)
brigid-api = { git = "https://github.com/brig-id/core", rev = "fa9602432595f37540a9ff268be6d6133b92f644", package = "brigid-api" }
brigid-store = { git = "https://github.com/brig-id/core", rev = "fa9602432595f37540a9ff268be6d6133b92f644", package = "brigid-store" }
brigid-identity = { git = "https://github.com/brig-id/core", rev = "fa9602432595f37540a9ff268be6d6133b92f644", package = "brigid-identity" }
brigid-webauthn = { git = "https://github.com/brig-id/core", rev = "fa9602432595f37540a9ff268be6d6133b92f644", package = "brigid-webauthn" }
brigid-oidc = { git = "https://github.com/brig-id/core", rev = "fa9602432595f37540a9ff268be6d6133b92f644", package = "brigid-oidc" }

# Cryptographic primitives
brigid-crypto = { git = "https://github.com/brig-id/crypto", rev = "52d0983b557b6f294b9f40a9896d95d03e2e4681" }

# CLI + configuration
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# HTTP / TLS
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
# Only used to install a default process-wide `CryptoProvider` at startup —
# see the call site in main.rs for why this is needed.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Misc
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# E2E smoke tests (tests/smoke.rs) — real HTTP against a spawned `leaf`
# subprocess, exercising a full WebAuthn ceremony via a software passkey.
jsonwebtoken = "10"
reqwest = { version = "0.12", features = ["json"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
