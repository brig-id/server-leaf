name: CI

on:
  push:
    branches: [main, "dev/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, "dev/*"]

# Least privilege by default; the release job widens it for itself.
permissions:
  contents: read

jobs:
  ci:
    uses: brig-id/.github/.github/workflows/ci-rust.yml@26e9a0393cb98cdb4f25e4d10f155230fb4db6f5
    with:
      working-directory: .

  security:
    uses: brig-id/.github/.github/workflows/security-audit.yml@26e9a0393cb98cdb4f25e4d10f155230fb4db6f5
    with:
      working-directory: .

  coverage:
    uses: brig-id/.github/.github/workflows/coverage.yml@26e9a0393cb98cdb4f25e4d10f155230fb4db6f5
    with:
      working-directory: .
      codecov-flags: server-leaf
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker:
    # Custom (not a brig-id/.github reusable workflow): validates that the
    # production Dockerfile still builds with the real brig-id/app UI
    # embedded (not just the ui/.gitkeep placeholder). Build-only — no
    # registry destination has been decided yet, so this doesn't push.
    #
    # GitHub withholds Actions secrets from workflow runs triggered by
    # Dependabot, so the "Checkout app (Qwik UI)" step below is skipped for
    # those runs — the UI stage falls back to the committed ui/.gitkeep
    # placeholder instead of failing on the missing npm_token. The real UI
    # build still runs on every push to main/dev/* once a dependabot PR is
    # merged, so coverage isn't lost, only deferred past the PR.
    name: Docker build (leaf + app UI embedded)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout server-leaf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout app (Qwik UI)
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: brig-id/app
          # Pinned so the UI embedded in the leaf image is reproducible: a
          # floating `main` means two builds of the same server-leaf commit
          # could embed different UI code depending on when they ran. Bump
          # deliberately when app ships a change meant to land in leaf.
          ref: 15b6ece9af006dc32eef32d88091c013b0ad432c # main @ 2026-11-11
          path: ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          secrets: |
            npm_token=${{ secrets.WEBAWESOME_NPM_TOKEN }}

  # Runs only on a `vX.Y.Z` tag push — the actual release artifact. Separate
  # from the `docker` validation job above (which stays fast, single-arch,
  # build-only) so every PR/branch push doesn't publish an image.
  docker-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Docker release (build + push, multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout server-leaf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the step below can tell whether the tag is on main.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        # The VM deploys the highest vX.Y.Z image on its own: a release must
        # only ever be built from a commit that went through main.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Checkout app (Qwik UI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: brig-id/app
          # Same pin as the validation job above — keep both in sync when
          # bumping. Once app/core/crypto have their own tagged releases,
          # this should point at the app tag that belongs to this leaf
          # release rather than a bare commit.
          ref: 15b6ece9af006dc32eef32d88091c013b0ad432c # main @ 2026-11-11
          path: ui

      - name: Set up QEMU (cross-arch emulation for the arm64 build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          secrets: |
            npm_token=${{ secrets.WEBAWESOME_NPM_TOKEN }}
          # UNSPLASH_ACCESS_KEY is a plain build-arg, not a --secret: it's
          # meant to end up in the built JS bundle (see the Dockerfile
          # comment on the ui-builder stage), unlike npm_token above.
          build-args: |
            UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}
          tags: |
            ghcr.io/brig-id/leaf:${{ github.ref_name }}
            ghcr.io/brig-id/leaf:latest
