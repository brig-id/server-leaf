# brig·id leaf — development deployment (plain HTTP, no TLS, no Docker secrets)
#
# For local development only. Do NOT use in production.
#
# Requirements:
#   1. Build the Qwik UI first (in the brig-id/app repo):
#        cd /workspaces/app && pnpm install --frozen-lockfile && pnpm build
#   2. Then start the server:
#        BRIGID_MASTER_KEY=<64-hex-chars> docker compose -f deploy/compose.dev.yaml up
#
# The compiled UI dist is bind-mounted from the host — no Node.js stage runs
# inside Docker for development. To test the full multi-stage Docker build
# (including the UI stage), run `docker build` from the server-leaf root after
# copying the app repo into `ui/`:
#   cp -r /workspaces/app ./ui && docker build -t brigid/leaf:dev .

volumes:
  leaf-data-dev:

services:
  leaf:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - leaf-data-dev:/data
      # Pre-built Qwik UI static files. Run `pnpm build` in brig-id/app first.
      - /workspaces/app/dist:/ui/dist:ro
    environment:
      RUST_LOG: "brigid_api=debug,leaf=debug,tower_http=debug,warn"
      BRIGID_MASTER_KEY: "${BRIGID_MASTER_KEY:?BRIGID_MASTER_KEY must be set}"
      LEAF_SERVER__DOMAIN: "${BRIGID_DOMAIN:-localhost}"
      LEAF_SERVER__HOST: "0.0.0.0"
      LEAF_SERVER__PORT: "8080"
      LEAF_DATABASE__PATH: "/data/brigid.db"
      # Serve the Qwik UI static files from the bind-mounted dist directory.
      LEAF_SERVER__UI_DIST_DIR: "/ui/dist"
    ports:
      - "8080:8080"
    healthcheck:
      # The distroless image has no shell or curl.
      # Disable here; the dev compose exposes the port directly for local
      # testing. A native --health-check flag will be added in a future phase.
      disable: true
